
name: Deploy Interviewer Companion Server

on:
  push:
    branches:
      - main
    paths:
      - 'Interviewer-companion-server/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Interviewer-companion-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Interviewer-companion-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          GOOGLE_CLIENT_ID: test-client-id
          SESSION_SECRET: test-session-secret-for-ci-only

      - name: Package Lambda
        run: npm run package:lambda

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name interviewer-companion-api \
            --zip-file fileb://lambda.zip

      - name: Wait for deployment
        run: |
          aws lambda wait function-updated \
            --function-name interviewer-companion-api

      - name: Verify deployment
        run: |
          aws lambda get-function \
            --function-name interviewer-companion-api
